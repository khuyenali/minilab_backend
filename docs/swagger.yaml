basePath: /
definitions:
  handlers.ApiResponse:
    properties:
      data: {}
      error:
        example: Error message
        type: string
      message:
        example: Operation completed successfully
        type: string
      status:
        example: success
        type: string
    type: object
  models.CreateUserRequest:
    properties:
      email:
        example: john@example.com
        type: string
      name:
        example: John Doe
        type: string
      role_id:
        example: 3
        type: integer
    required:
    - email
    - name
    type: object
  models.Role:
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      role_name:
        example: admin
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  models.UpdateUserRequest:
    properties:
      email:
        example: john.updated@example.com
        type: string
      name:
        example: John Doe Updated
        type: string
      role_id:
        example: 2
        type: integer
    type: object
  models.User:
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      email:
        example: john@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: John Doe
        type: string
      role:
        example: member
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@minilab.com
    name: API Support
    url: http://www.minilab.com/support
  description: A simple RESTful API server built with Go, Gin, sqlc, and golang-migrate.
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Mini Lab API
  version: "1.0"
paths:
  /api/v1/ping:
    get:
      description: Ping endpoint to test API connectivity
      produces:
      - application/json
      responses:
        "200":
          description: pong response
          schema:
            additionalProperties: true
            type: object
      summary: Ping
      tags:
      - ping
  /api/v1/roles:
    get:
      description: Get a list of all available roles
      produces:
      - application/json
      responses:
        "200":
          description: List of roles
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Role'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get all roles
      tags:
      - roles
  /api/v1/roles/{id}:
    get:
      description: Get a single role by its ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Role details
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Role'
              type: object
        "400":
          description: Invalid role ID
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Role not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get role by ID
      tags:
      - roles
  /api/v1/users:
    get:
      description: Get a list of all users
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.User'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get all users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user with the provided information
      parameters:
      - description: User information
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "409":
          description: User email already exists
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Create a new user
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      description: Delete a user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Delete user
      tags:
      - users
    get:
      description: Get a single user by their ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User details
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update an existing user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated user information
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid user ID or request body
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "409":
          description: User email already exists
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Update user
      tags:
      - users
  /health:
    get:
      description: Check if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: API is running
          schema:
            additionalProperties: true
            type: object
      summary: Health Check
      tags:
      - health
schemes:
- http
- https
swagger: "2.0"
