basePath: /
definitions:
  handlers.ApiResponse:
    properties:
      data: {}
      error:
        example: Error message
        type: string
      message:
        example: Operation completed successfully
        type: string
      status:
        example: success
        type: string
    type: object
  models.CreateMachineRequest:
    properties:
      estimate_time:
        example: 120
        minimum: 1
        type: integer
      name:
        example: 3D Printer Model X
        type: string
      quantity:
        example: 2
        minimum: 1
        type: integer
      task_type_id:
        example: 1
        type: integer
    required:
    - estimate_time
    - name
    - quantity
    type: object
  models.CreateTaskRequest:
    properties:
      end_time:
        example: "2024-07-05T00:00:00Z"
        type: string
      note:
        example: Annual company-wide retreat
        type: string
      priority:
        example: medium
        type: string
      start_time:
        example: "2024-07-01T00:00:00Z"
        type: string
      status:
        example: pending
        type: string
      sub_tasks:
        items:
          $ref: '#/definitions/models.SubTaskRequest'
        type: array
      task_name:
        example: Organize Company Retreat
        type: string
    required:
    - task_name
    type: object
  models.CreateTaskTypeRequest:
    properties:
      description:
        example: 3D printing and modeling tasks
        type: string
      machines:
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      name:
        example: 3D Printing
        type: string
      users:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    required:
    - name
    type: object
  models.CreateUserRequest:
    properties:
      email:
        example: john@example.com
        type: string
      name:
        example: John Doe
        type: string
      role_id:
        example: 3
        type: integer
    required:
    - email
    - name
    type: object
  models.Machine:
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      estimate_time:
        description: in minutes
        example: 120
        type: integer
      id:
        example: 1
        type: integer
      name:
        example: 3D Printer Model X
        type: string
      quantity:
        example: 2
        type: integer
      task_type:
        example: 3D Printing
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  models.MachineBasic:
    properties:
      estimate_time:
        description: in minutes
        example: 120
        type: integer
      id:
        example: 1
        type: integer
      name:
        example: 3D Printer Model X
        type: string
      quantity:
        example: 2
        type: integer
    type: object
  models.Role:
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      role_name:
        example: admin
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  models.SubTask:
    properties:
      assignments:
        items:
          $ref: '#/definitions/models.UserSubTaskAssignment'
        type: array
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      description:
        example: Book the venue for the retreat
        type: string
      estimate_effort:
        example: 8
        type: integer
      id:
        example: 105
        type: integer
      status:
        example: pending
        type: string
      sub_task_name:
        example: Venue Booking Sub-Task
        type: string
      task_id:
        example: 3
        type: integer
      type_id:
        example: 10
        type: integer
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  models.SubTaskRequest:
    properties:
      type_id:
        example: 10
        type: integer
      user_ids:
        example:
        - 3
        - 7
        items:
          type: integer
        type: array
    required:
    - type_id
    type: object
  models.Task:
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      end_time:
        example: "2024-07-05T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      note:
        example: Annual company-wide retreat
        type: string
      priority:
        example: high
        type: string
      start_time:
        example: "2024-07-01T00:00:00Z"
        type: string
      status:
        example: pending
        type: string
      sub_tasks:
        items:
          $ref: '#/definitions/models.SubTask'
        type: array
      task_name:
        example: Organize Company Retreat
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  models.TaskType:
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      description:
        example: 3D printing services
        type: string
      id:
        example: 1
        type: integer
      machines:
        items:
          $ref: '#/definitions/models.MachineBasic'
        type: array
      name:
        example: 3D Printing
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      users:
        items:
          $ref: '#/definitions/models.UserBasic'
        type: array
    type: object
  models.TaskTypeMinimal:
    properties:
      description:
        example: 3D printing services
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 3D Printing
        type: string
    type: object
  models.UpdateMachineRequest:
    properties:
      estimate_time:
        example: 90
        minimum: 1
        type: integer
      name:
        example: 3D Printer Model Y
        type: string
      quantity:
        example: 3
        minimum: 1
        type: integer
      task_type_id:
        example: 2
        type: integer
    type: object
  models.UpdateTaskRequest:
    properties:
      end_time:
        example: "2024-07-05T00:00:00Z"
        type: string
      note:
        example: Updated note
        type: string
      priority:
        example: high
        type: string
      start_time:
        example: "2024-07-01T00:00:00Z"
        type: string
      status:
        example: in-progress
        type: string
      task_name:
        example: Updated Task Name
        type: string
    type: object
  models.UpdateTaskTypeRequest:
    properties:
      description:
        example: Updated description
        type: string
      machines:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      name:
        example: 3D Printing Updated
        type: string
      users:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    type: object
  models.UpdateUserRequest:
    properties:
      email:
        example: john.updated@example.com
        type: string
      name:
        example: John Doe Updated
        type: string
      role_id:
        example: 2
        type: integer
    type: object
  models.User:
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      email:
        example: john@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: John Doe
        type: string
      role:
        example: member
        type: string
      task_types:
        items:
          $ref: '#/definitions/models.TaskTypeMinimal'
        type: array
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  models.UserBasic:
    properties:
      user_id:
        example: 1
        type: integer
      user_name:
        example: John Doe
        type: string
    type: object
  models.UserSubTaskAssignment:
    properties:
      assigned_at:
        example: "2023-01-01T12:00:00Z"
        type: string
      assignment_id:
        example: 201
        type: integer
      report:
        example: Task assigned to implement the UI
        type: string
      sub_task_id:
        example: 105
        type: integer
      updated_at:
        example: "2023-01-01T12:00:00Z"
        type: string
      user_details:
        $ref: '#/definitions/models.UserBasic'
      user_id:
        example: 3
        type: integer
    type: object
  models.UserTaskAssignmentRequest:
    properties:
      task_types:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    required:
    - task_types
    type: object
host: localhost:8080
info:
  contact:
    email: support@minilab.com
    name: API Support
    url: http://www.minilab.com/support
  description: A simple RESTful API server built with Go, Gin, sqlc, and golang-migrate.
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Mini Lab API
  version: "1.0"
paths:
  /api/v1/machine:
    get:
      description: Get a list of all machines
      produces:
      - application/json
      responses:
        "200":
          description: List of machines
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Machine'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get all machines
      tags:
      - machines
    post:
      consumes:
      - application/json
      description: Create a new machine with optional task type assignment
      parameters:
      - description: Machine creation data
        in: body
        name: machine
        required: true
        schema:
          $ref: '#/definitions/models.CreateMachineRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Machine created successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Machine'
              type: object
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Create a new machine
      tags:
      - machines
  /api/v1/machine/{id}:
    delete:
      description: Delete a machine by ID
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Machine deleted successfully
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "400":
          description: Invalid machine ID
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Machine not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Delete a machine
      tags:
      - machines
    get:
      description: Get a single machine by its ID
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Machine details
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Machine'
              type: object
        "400":
          description: Invalid machine ID
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Machine not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get machine by ID
      tags:
      - machines
    put:
      consumes:
      - application/json
      description: Update an existing machine by ID
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: integer
      - description: Machine update data
        in: body
        name: machine
        required: true
        schema:
          $ref: '#/definitions/models.UpdateMachineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Machine updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Machine'
              type: object
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Machine not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Update a machine
      tags:
      - machines
  /api/v1/ping:
    get:
      description: Ping endpoint to test API connectivity
      produces:
      - application/json
      responses:
        "200":
          description: pong response
          schema:
            additionalProperties: true
            type: object
      summary: Ping
      tags:
      - ping
  /api/v1/roles:
    get:
      description: Get a list of all available roles
      produces:
      - application/json
      responses:
        "200":
          description: List of roles
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Role'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get all roles
      tags:
      - roles
  /api/v1/roles/{id}:
    get:
      description: Get a single role by its ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Role details
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Role'
              type: object
        "400":
          description: Invalid role ID
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Role not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get role by ID
      tags:
      - roles
  /api/v1/task_type:
    get:
      description: Get a list of all task types
      produces:
      - application/json
      responses:
        "200":
          description: List of task types
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.TaskType'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get all task types
      tags:
      - task-types
    post:
      consumes:
      - application/json
      description: Create a new task type with optional machine assignments
      parameters:
      - description: Task type creation data
        in: body
        name: task_type
        required: true
        schema:
          $ref: '#/definitions/models.CreateTaskTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Task type created successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TaskType'
              type: object
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Create a new task type
      tags:
      - task-types
  /api/v1/task_type/{id}:
    delete:
      description: Delete a task type by ID
      parameters:
      - description: Task Type ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Task type deleted successfully
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "400":
          description: Invalid task type ID
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Task type not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Delete a task type
      tags:
      - task-types
    get:
      description: Get a single task type by its ID with associated machines
      parameters:
      - description: Task Type ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Task type details with machines
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TaskType'
              type: object
        "400":
          description: Invalid task type ID
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Task type not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get task type by ID
      tags:
      - task-types
    put:
      consumes:
      - application/json
      description: Update an existing task type by ID
      parameters:
      - description: Task Type ID
        in: path
        name: id
        required: true
        type: integer
      - description: Task type update data
        in: body
        name: task_type
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTaskTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Task type updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TaskType'
              type: object
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Task type not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Update a task type
      tags:
      - task-types
  /api/v1/tasks:
    get:
      description: Get a list of all tasks
      produces:
      - application/json
      responses:
        "200":
          description: List of tasks
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Task'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get all tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Create a new task with optional sub-tasks and user assignments
      parameters:
      - description: Task creation data with sub-tasks and assignments
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/models.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Task created successfully with sub-tasks and assignments
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Task'
              type: object
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Create a new task with sub-tasks and assignments
      tags:
      - tasks
  /api/v1/tasks/{id}:
    delete:
      description: Delete an existing task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Task deleted successfully
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "400":
          description: Invalid task ID
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Delete a task
      tags:
      - tasks
    get:
      description: Get a single task by its ID with associated sub-tasks and assignments
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Task details with sub-tasks and assignments
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Task'
              type: object
        "400":
          description: Invalid task ID
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Get task by ID
      tags:
      - tasks
    put:
      consumes:
      - application/json
      description: Update an existing task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Task update data
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Task updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Task'
              type: object
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Update a task
      tags:
      - tasks
  /api/v1/user/{id}:
    put:
      consumes:
      - application/json
      description: Assign task types to a user (only for members)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Task type assignment data
        in: body
        name: task_types
        required: true
        schema:
          $ref: '#/definitions/models.UserTaskAssignmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Task types assigned successfully
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "400":
          description: Invalid input data or user role
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ApiResponse'
      summary: Assign task types to a user
      tags:
      - users
  /api/v1/users:
    get:
      description: Get a list of all users with optional role filtering
      parameters:
      - description: Filter by role ID
        example: 3
        in: query
        name: role_id
        type: integer
      - description: Limit the number of results
